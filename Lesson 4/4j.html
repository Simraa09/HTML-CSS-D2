<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lesson 4</title>
    <style>
        .shadow{
            background-color: green;
            color:white;
            border: none;
            padding-top: 7px;
            padding-bottom: 7px;
            padding-left: 10px;
            padding-right: 10px;
            box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.25);
            cursor: pointer;
        }

        .shadow:active{
            box-shadow: 0px 0px 0px rgba(0, 0, 0, 0);
            margin-top: 2px;
            margin-left: 2px;
        }

    </style>
</head>
<body>
    <button class="shadow"> Shadow </button>
</body>
</html>
