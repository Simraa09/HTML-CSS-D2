<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <style>
        .start{
            background-color: rgb(121, 82, 179);
            color: white;
            border:none;
            height:36px;
            width:105px;
            border-radius:3px;
            font-weight:bold;
            cursor:pointer;
        }
        .download{
            background-color: white;
            color:rgb(108,117,125);
            border-color: rgb(108,117,125);
            border-style: solid;
            border-width: 1px;
            height:36px;
            width:100px;
            border-radius:3px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <button class="start">Get started</button>
    <button class="download">Download</button>
</body>
</html>
