<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn</title>
    <style>
        .apply{
            background-color: rgb(10, 102, 194);
            color: white;
            border:none;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            border-radius:30px;
            font-weight:bold;
            cursor:pointer;
            transition: background-color 0.15s;
        }
        .apply:hover{
            background-color: rgb(6, 74, 143);
        }
        .save{
            background-color: white;
            color:rgb(10, 102, 194);
            border-color: rgb(10, 102, 194);
            border-style: solid;
            border-width: 1px;
            padding-top: 9px;
            padding-bottom: 9px;
            padding-left: 20px;
            padding-right: 20px;
            border-radius:30px;
            cursor:pointer;
            transition: background-color 0.15s, border-width 0.15s, font-weight 0.15s,;
        }
        .save:hover{
            background-color: rgb(227, 242, 255);
            border-width: 2px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <button class="apply">Apply on company website</button>
    <button class="save">Save</button>
</body>
</html>
