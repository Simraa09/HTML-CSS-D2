<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
    <style>
        .amazon{
            background-color:rgb(255, 216, 20);
            color: black;
            border:none;
            padding-top: 7px;
            padding-bottom: 7px;
            padding-left: 55px;
            padding-right: 55px;
            border-radius:30px;
            cursor:pointer;
            transition: background-color 0.15s;
        }

        .amazon:hover{
           background-color:rgb(245, 206, 12); 
        }
    </style>
</head>
<body>
    <button class="amazon">Add to cart</button>
</body>
</html>
