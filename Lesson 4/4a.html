<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
    <style>
        .uber{
            background-color: black;
            color: white;
            border:none;
            padding-top: 12px;
            padding-bottom: 12px;
            padding-left: 16px;
            padding-right: 16px;
            border-radius:1px;
            cursor:pointer;
            transition: opacity 0.15s;
        }

        .uber:hover{
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <button class="uber">Request now</button>
</body>
</html>
