<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lesson 4</title>
    <style>
        .button{
            background-color: green;
            color:white;
            border: none;
            cursor: pointer;
            padding-top: 8px;
            padding-bottom: 8px;
            padding-left: 15px;
            padding-right: 15px;
            margin-left: 10px;
            margin-right: 10px;
            transition: all 0.15s;
        }

        .button:hover {
            padding-left: 25px;
            padding-right: 25px;
            margin-left: 0px;
            margin-right: 0px;
        }
    </style>
</head>
<body>
    <button class="button"> One </button>
    <button class="button"> Two </button>
    <button class="button"> Three </button>
</body>
</html>
