<!DOCTYPE html>
<html lang="en">
<head>
    <title>Challenge</title>
    <style>
        .link{
            color:rgb(0, 113, 133);
            transition: color 0.15s;
        }
        .link:hover{
            color: red
        }

        .title{
            font-weight: bold;
            font-size: x-large;
        }

        .price{
            color:rgb(0, 118, 0);
            font-weight: bold;
        }

        .cart{
            background-color: rgb(255, 216, 20);
            color:black;
            border:none;
            height: 30px;
            width:115px;
            border-radius: 30px;
            transition: background-color 0.15s, opacity 0.15s;
        }
        .cart:hover{
            background-color: rgb(245, 209, 28);
        }
        .cart:active{
            opacity: 0.5;
        }

        .buy{
            background-color: rgb(255, 164, 28);
            color:black;
            border:none;
            height: 30px;
            width:115px;
            border-radius: 30px;
            margin-left: 10px;
            transition: background-color 0.15s, opacity 0.15s;
        }
        .buy:hover{
            background-color:rgb(221, 135, 5);
        }
        .buy:active{
            opacity: 0.5;
        }
    

    </style>
</head>
<body>
    <a class="link" href="https://www.amazon.in/" >Back to Amazon</a>
    <p class="title"> Nike Black Running Shoes </p>
    <p class="price"> $39 - in stock.</p>
    <p> Free delivery tommorow.</p>
    <button class="cart"> Add to cart</button>  
    <button class="buy"> Buy Now</button>
</body>
</html>
