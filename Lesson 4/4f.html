<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
    <style>
        .subscriber-button{
            background-color: red;
            color: rgb(255, 255, 255);
            border:none;
            height:36px;
            width:105px;
            border-radius:2px;
            vertical-align: top;
            cursor:pointer;
            margin-right:8px;
            transition: opacity 0.15s;
        }

        .subscribe-button:hover {
          opacity: 0.8;
        }

        .subscribe-button:active {
           opacity: 0.5;
        }

        .join-button{
            background-color: white;
            border-color: rgb(41, 56, 78);
            border-style: solid;
            border-width: 1px;
            color:rgb(41, 118, 211);
            height:36px;
            width:62px;
            border-radius:2px;
            vertical-align: top;
            cursor:pointer;
            transition: background-color 0.15s, color 0.15s;
        }

        .join-button:hover {
            background-color: rgb(41, 118, 211);
            color: white;
        }

        .join-button:active {
            opacity: 0.7;
        }

        .tweet-button{
            background-color: blue;
            color: rgb(255, 255, 255);
            border:none;
            padding-top: 9px;
            padding-bottom: 9px;
            padding-left: 18px;
            padding-right: 18px;
            border-radius:18px;
            font-weight:bold;
            font-size:15px;
            cursor:pointer;
            margin-left:8px;
            transition: box-shadow 0.15s;
        }

        .tweet-button:hover {
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <button class="subscriber-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">Tweet</button>
</body>
</html>
